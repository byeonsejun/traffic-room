name: collect-events
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

# 같은 워크플로가 겹쳐 돌아 DB 쓰기가 경합하지 않도록 한 번에 하나만 실행한다.
concurrency:
  group: collect-events
  cancel-in-progress: false

permissions:
  contents: read

# 60일 무활동으로 예약 실행이 꺼지는 것은 collect-cctvs 의 keepalive 가 두 워크플로 모두 막는다.

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @traffic-room/collector events
        env:
          ITS_MODE: live
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

