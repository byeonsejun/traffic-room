# ITS 가 클라우드 IP(GitHub Actions 포함)의 접속을 막아서 이 워크플로는 예약 실행하지 않는다.
# 수집은 국내 회선의 Mac 에서 scripts/collect-local.sh 로 돌린다(docs/deploy.md). 수동 실행용으로만 남겨 둔다.
name: collect-events
on:
  workflow_dispatch:

# 같은 워크플로가 겹쳐 돌아 DB 쓰기가 경합하지 않도록 한 번에 하나만 실행한다.
concurrency:
  group: collect-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @traffic-room/collector events
        env:
          ITS_MODE: live
          ITS_API_KEY: ${{ secrets.ITS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

